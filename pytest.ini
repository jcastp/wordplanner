[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Coverage is opt-in, so a single file or test runs clean: `pytest --cov`
# measures the whole suite and fails under the threshold in .coveragerc
addopts =
    --verbose
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
